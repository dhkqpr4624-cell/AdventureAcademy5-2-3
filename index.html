    <!--
      Vite replaces this source entry with the hashed production bundle during `npm run build`.
      If this exact tag reaches a browser, the site is serving unbuilt source (e.g. GitHub Pages

    -->
    <script type="module" src="/src/main.tsx" onerror="var s=document.getElementById('boot-status');if(s){s.textContent='게임 파일을 불러오지 못했습니다. 빌드되지 않은 소스가 배포된 것 같습니다. 저장소 Settings → Pages → Build and deployment → Source를 GitHub Actions로 설정한 뒤 Deploy to GitHub Pages 워크플로를 다시 실행해 주세요.'}"></script>
